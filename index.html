<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Agenda Mari</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222c;
    --border: #2e2e3a;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #f0effe;
    --muted: #8b8aa0;
    --pill: #2a2a38;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo span { color: var(--accent2); }
  .date-badge {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 16px 20px 0;
  }
  .tab {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* SECTIONS */
  .section { display: none; flex-direction: column; flex: 1; }
  .section.active { display: flex; }

  /* MIC AREA */
  .mic-area {
    padding: 24px 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .mic-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
    box-shadow: 0 0 0 0 rgba(124,106,247,0.4);
  }
  .mic-btn:active { transform: scale(0.94); }
  .mic-btn.recording {
    background: var(--red);
    animation: pulse 1.2s infinite;
    box-shadow: 0 0 0 0 rgba(248,113,113,0.4);
  }
  .mic-btn svg { width: 32px; height: 32px; fill: white; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); }
    70% { box-shadow: 0 0 0 18px rgba(248,113,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); }
  }

  .mic-label {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .mic-label strong { color: var(--text); display: block; margin-bottom: 2px; }

  /* TRANSCRIPT BOX */
  .transcript-box {
    margin: 0 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    min-height: 70px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    position: relative;
  }
  .transcript-box.empty::before {
    content: 'Sua fala vai aparecer aqui...';
    color: var(--muted);
    font-style: italic;
  }
  .transcript-placeholder { color: var(--muted); font-style: italic; }

  /* ASSISTANT REPLY */
  .assistant-bubble {
    margin: 12px 20px;
    background: linear-gradient(135deg, #1e1b3a, #22222c);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
    display: none;
  }
  .assistant-bubble.visible { display: block; }
  .assistant-label {
    font-size: 11px;
    color: var(--accent2);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin: 8px 20px 0;
  }
  .btn-confirm, .btn-correct {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    display: none;
  }
  .btn-confirm { background: var(--green); color: #000; }
  .btn-correct { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-confirm.visible, .btn-correct.visible { display: block; }

  /* LOADING */
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .loading-dots span {
    width: 6px; height: 6px;
    background: var(--accent2);
    border-radius: 50%;
    animation: dot-bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* AGENDA LIST */
  .agenda-section {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 20px;
  }
  .agenda-day-header {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .agenda-day-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .reminder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    position: relative;
    transition: border-color 0.2s;
  }
  .reminder-card.done { opacity: 0.45; }
  .reminder-card.done .reminder-title { text-decoration: line-through; }
  .reminder-card.overdue { border-color: var(--red); }
  .reminder-card.upcoming { border-color: var(--yellow); }

  .reminder-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
    background: var(--accent);
  }
  .reminder-card.done .reminder-dot { background: var(--muted); }
  .reminder-card.overdue .reminder-dot { background: var(--red); }
  .reminder-card.upcoming .reminder-dot { background: var(--yellow); }

  .reminder-body { flex: 1; }
  .reminder-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .reminder-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tag {
    background: var(--pill);
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 11px;
    color: var(--accent2);
  }
  .reminder-time { font-size: 13px; color: var(--text); font-weight: 500; }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .del-btn:hover { color: var(--red); }

  .done-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .done-btn:hover { color: var(--green); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 20px;
  }
  .empty-state div { font-size: 32px; margin-bottom: 8px; }

  /* NOTIFICATION TOAST */
  #toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 13px;
    z-index: 9999;
    transition: transform 0.3s ease;
    max-width: calc(100vw - 40px);
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast .toast-title { font-weight: 600; color: var(--accent2); margin-bottom: 2px; }

  /* SETTINGS */
  .settings-section { padding: 20px; }
  .settings-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .setting-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .setting-row label { color: var(--muted); font-size: 12px; display: block; margin-bottom: 4px; }

  /* PROCESSING STATE */
  .processing-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,15,19,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 16px;
  }
  .processing-overlay.visible { display: flex; }
  .processing-overlay p { color: var(--muted); font-size: 14px; }

  /* SPEAK BTN */
  .speak-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent2);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
  }
  .speak-btn:hover { background: var(--surface2); }
</style>
</head>
<body>

<header>
  <div class="logo">agenda<span>mari</span></div>
  <div class="date-badge" id="headerDate">carregando...</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('voice')">🎙 Voz</div>
  <div class="tab" onclick="switchTab('agenda')">📋 Agenda</div>
</div>

<!-- VOZ -->
<div class="section active" id="tab-voice">
  <div class="mic-area">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">
      <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v7a2 2 0 1 0 4 0V5a2 2 0 0 0-2-2zm-7 9a7 7 0 0 0 14 0h2a9 9 0 0 1-8 8.94V23h-2v-2.06A9 9 0 0 1 3 12h2z"/></svg>
    </button>
    <div class="mic-label">
      <strong id="micStatus">Toque para falar</strong>
      Diga o lembrete, dia e horário
    </div>
  </div>

  <div class="transcript-box empty" id="transcriptBox">
    <span class="transcript-placeholder">Sua fala vai aparecer aqui...</span>
  </div>

  <div class="assistant-bubble" id="assistantBubble">
    <div class="assistant-label">Assistente</div>
    <div id="assistantText"></div>
    <button class="speak-btn" id="speakReplyBtn" onclick="speakReply()" style="display:none">🔊 Ouvir resposta</button>
  </div>

  <div class="action-row">
    <button class="btn-correct" id="btnCorrect" onclick="startCorrection()">✏️ Corrigir</button>
    <button class="btn-confirm" id="btnConfirm" onclick="confirmReminder()">✅ Confirmar</button>
  </div>

  <div style="padding: 16px 20px 8px;">
    <div style="font-size: 11px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Exemplos do que você pode dizer</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <div class="tag">Reunião segunda 14h</div>
      <div class="tag">Lembrar de pagar conta sexta</div>
      <div class="tag">Médico amanhã às 10h</div>
      <div class="tag">Entregar relatório hoje 18h</div>
    </div>
  </div>
</div>

<!-- AGENDA -->
<div class="section" id="tab-agenda">
  <div class="agenda-section" id="agendaList"></div>
</div>

<!-- PROCESSING OVERLAY -->
<div class="processing-overlay" id="processingOverlay">
  <div class="loading-dots"><span></span><span></span><span></span></div>
  <p id="processingLabel">Processando...</p>
</div>

<!-- TOAST -->
<div id="toast">
  <div class="toast-title" id="toastTitle"></div>
  <div id="toastBody"></div>
</div>

<script>
// ═══ STATE ═══════════════════════════════════════════
let reminders = JSON.parse(localStorage.getItem('mari_reminders') || '[]');
let pendingReminder = null;
let recognition = null;
let isRecording = false;
let synth = window.speechSynthesis;
let lastReplyText = '';
let correctionMode = false;

// ═══ INIT ═══════════════════════════════════════════
function init() {
  updateHeaderDate();
  renderAgenda();
  startNotificationLoop();
  requestNotificationPermission();
  setInterval(updateHeaderDate, 60000);
}

function updateHeaderDate() {
  const now = new Date();
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  document.getElementById('headerDate').textContent = now.toLocaleDateString('pt-BR', opts);
}

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// ═══ TABS ═══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'voice') || (i === 1 && tab === 'agenda'));
  });
  document.getElementById('tab-voice').classList.toggle('active', tab === 'voice');
  document.getElementById('tab-agenda').classList.toggle('active', tab === 'agenda');
  if (tab === 'agenda') renderAgenda();
}

// ═══ MICROFONE ════════════════════════════════════════
function toggleMic() {
  if (isRecording) stopRecording();
  else startRecording();
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('Atenção', 'Reconhecimento de voz não suportado neste navegador. Use Chrome.');
    return;
  }

  correctionMode = false;
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('micStatus').textContent = 'Ouvindo...';
    setTranscript('');
    hideBubble();
  };

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let r of e.results) {
      if (r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    setTranscript(final || interim, !final);
    if (final) processTranscript(final.trim());
  };

  recognition.onerror = (e) => {
    stopRecording();
    if (e.error !== 'no-speech') showToast('Erro', 'Problema no microfone: ' + e.error);
  };

  recognition.onend = () => stopRecording();
  recognition.start();
}

function stopRecording() {
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micStatus').textContent = 'Toque para falar';
  if (recognition) { try { recognition.stop(); } catch(e){} }
}

function setTranscript(text, interim) {
  const box = document.getElementById('transcriptBox');
  box.classList.remove('empty');
  box.innerHTML = interim
    ? `<span style="color:var(--muted);font-style:italic">${escHtml(text)}</span>`
    : escHtml(text) || '<span class="transcript-placeholder">Sua fala vai aparecer aqui...</span>';
  if (!text) box.classList.add('empty');
}

// ═══ PROCESSAR COM CLAUDE ═════════════════════════════
async function processTranscript(text) {
  if (!text) return;
  showProcessing('Analisando com IA...');

  const now = new Date();
  const systemPrompt = `Voce e a assistente pessoal da Mariana, gerente de PMO.
Data/hora atual: ${now.toLocaleDateString('pt-BR', {weekday:'long', year:'numeric', month:'long', day:'numeric'})} as ${now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}.

Mariana vai dizer um lembrete por voz. Voce deve:
1. Extrair: o que lembrar, quando (data + hora), e categoria (Trabalho/Pessoal/Saude/Financeiro)
2. Se faltar alguma informacao essencial, pergunte de forma direta e curta
3. Validar o entendido de volta para ela em voz ativa, curta, como uma assistente faria

Responda SOMENTE em JSON, sem markdown, sem explicacoes, sem backticks:
{
  "entendido": true ou false,
  "pergunta": "se entendido=false, qual pergunta fazer",
  "validacao": "texto que serah falado em voz alta para confirmar (max 2 frases)",
  "lembrete": {
    "titulo": "titulo curto do lembrete",
    "data": "YYYY-MM-DD",
    "hora": "HH:MM ou null se for o dia todo",
    "categoria": "Trabalho|Pessoal|Saude|Financeiro",
    "texto_original": "${text.replace(/"/g, "'")}"
  }
}

Se entendido=false, lembrete pode ser null.
Ao inferir datas relativas (segunda, amanha, etc), use a data atual fornecida.
Se a hora nao for mencionada, use null.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: text }]
      })
    });

    const data = await res.json();
    hideProcessing();

    if (!res.ok) throw new Error(data.error?.message || 'Erro na API');

    const rawText = data.content.map(c => c.text || '').join('');
    const clean = rawText.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    if (parsed.entendido && parsed.lembrete) {
      pendingReminder = parsed.lembrete;
      showBubble(parsed.validacao, true);
      speak(parsed.validacao);
    } else {
      pendingReminder = null;
      showBubble(parsed.pergunta || 'Nao entendi. Pode repetir?', false);
      speak(parsed.pergunta || 'Nao entendi. Pode repetir?');
    }

  } catch(err) {
    hideProcessing();
    showBubble('Erro ao processar. Verifique a conexao e tente novamente.', false);
    console.error(err);
  }
}

// ═══ CORRECAO POR VOZ ═════════════════════════════════
function startCorrection() {
  correctionMode = true;
  hideBubble();
  setTranscript('');
  document.getElementById('micStatus').textContent = 'Fale a correcao...';
  startRecording();
}

// ═══ CONFIRMAR LEMBRETE ═══════════════════════════════
function confirmReminder() {
  if (!pendingReminder) return;

  const r = {
    id: Date.now(),
    titulo: pendingReminder.titulo,
    data: pendingReminder.data,
    hora: pendingReminder.hora,
    categoria: pendingReminder.categoria,
    feito: false,
    notificado: false
  };

  reminders.push(r);
  saveReminders();
  pendingReminder = null;
  hideBubble();
  setTranscript('');

  const confirmMsg = 'Anotado! Lembrete salvo na agenda.';
  showBubble(confirmMsg, false);
  speak(confirmMsg);
  setTimeout(hideBubble, 3000);

  scheduleNotification(r);
}

// ═══ BUBBLE & UI ═════════════════════════════════════
function showBubble(text, showButtons) {
  const bubble = document.getElementById('assistantBubble');
  document.getElementById('assistantText').textContent = text;
  lastReplyText = text;
  bubble.classList.add('visible');
  document.getElementById('speakReplyBtn').style.display = 'inline-block';
  document.getElementById('btnConfirm').classList.toggle('visible', showButtons);
  document.getElementById('btnCorrect').classList.toggle('visible', showButtons);
}

function hideBubble() {
  document.getElementById('assistantBubble').classList.remove('visible');
  document.getElementById('btnConfirm').classList.remove('visible');
  document.getElementById('btnCorrect').classList.remove('visible');
  document.getElementById('speakReplyBtn').style.display = 'none';
}

function showProcessing(label) {
  document.getElementById('processingLabel').textContent = label;
  document.getElementById('processingOverlay').classList.add('visible');
}

function hideProcessing() {
  document.getElementById('processingOverlay').classList.remove('visible');
}

// ═══ SINTESE DE VOZ ═══════════════════════════════════
function speak(text) {
  if (!synth) return;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'pt-BR';
  utt.rate = 1.05;
  utt.pitch = 1;

  const voices = synth.getVoices();
  const ptBR = voices.find(v => v.lang === 'pt-BR') || voices.find(v => v.lang.startsWith('pt'));
  if (ptBR) utt.voice = ptBR;

  synth.speak(utt);
}

function speakReply() { speak(lastReplyText); }

// ═══ AGENDA RENDER ═════════════════════════════════════
function renderAgenda() {
  const container = document.getElementById('agendaList');
  if (!reminders.length) {
    container.innerHTML = `<div class="empty-state"><div>📋</div>Nenhum lembrete ainda.<br>Use o microfone para adicionar.</div>`;
    return;
  }

  const now = new Date();
  const sorted = [...reminders].sort((a, b) => {
    const da = new Date(a.data + (a.hora ? 'T' + a.hora : 'T00:00'));
    const db = new Date(b.data + (b.hora ? 'T' + b.hora : 'T00:00'));
    return da - db;
  });

  const grouped = {};
  sorted.forEach(r => {
    if (!grouped[r.data]) grouped[r.data] = [];
    grouped[r.data].push(r);
  });

  let html = '';
  for (const [date, items] of Object.entries(grouped)) {
    const d = new Date(date + 'T12:00:00');
    const label = formatDateLabel(d, now);
    html += `<div class="agenda-day-header">${label}</div>`;
    items.forEach(r => {
      const dt = new Date(r.data + (r.hora ? 'T' + r.hora : 'T23:59'));
      const overdue = !r.feito && dt < now;
      const upcoming = !r.feito && dt > now && (dt - now) < 3600000;
      html += `
        <div class="reminder-card ${r.feito ? 'done' : ''} ${overdue ? 'overdue' : ''} ${upcoming ? 'upcoming' : ''}">
          <div class="reminder-dot"></div>
          <div class="reminder-body">
            <div class="reminder-title">${escHtml(r.titulo)}</div>
            <div class="reminder-meta">
              ${r.hora ? `<span class="reminder-time">${r.hora}</span>` : '<span style="color:var(--muted);font-size:12px">Dia todo</span>'}
              <span class="tag">${r.categoria}</span>
            </div>
          </div>
          <button class="done-btn" onclick="toggleDone(${r.id})" title="${r.feito ? 'Desfazer' : 'Concluir'}">${r.feito ? '↩' : '✓'}</button>
          <button class="del-btn" onclick="deleteReminder(${r.id})" title="Excluir">×</button>
        </div>`;
    });
  }
  container.innerHTML = html;
}

function formatDateLabel(d, now) {
  const today = new Date(now); today.setHours(0,0,0,0);
  const target = new Date(d); target.setHours(0,0,0,0);
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) return 'Hoje';
  if (diff === 1) return 'Amanha';
  if (diff === -1) return 'Ontem';
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
}

function toggleDone(id) {
  const r = reminders.find(r => r.id === id);
  if (r) { r.feito = !r.feito; saveReminders(); renderAgenda(); }
}

function deleteReminder(id) {
  reminders = reminders.filter(r => r.id !== id);
  saveReminders();
  renderAgenda();
}

// ═══ NOTIFICACOES ══════════════════════════════════════
function scheduleNotification(r) {
  if (!r.hora) return;
  const target = new Date(r.data + 'T' + r.hora);
  const now = new Date();
  const diff = target - now;
  if (diff > 0 && diff < 86400000 * 7) {
    setTimeout(() => fireNotification(r), diff);
  }
}

function fireNotification(r) {
  const idx = reminders.findIndex(x => x.id === r.id);
  if (idx > -1) reminders[idx].notificado = true;
  saveReminders();

  showToast(r.titulo, r.hora ? `Agora - ${r.hora}` : 'Lembrete');
  speak(`Mariana, lembrete: ${r.titulo}`);

  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Agenda Mari', { body: r.titulo, icon: '' });
  }
}

function startNotificationLoop() {
  setInterval(() => {
    const now = new Date();
    reminders.forEach(r => {
      if (r.feito || r.notificado || !r.hora) return;
      const target = new Date(r.data + 'T' + r.hora);
      if (now >= target && (now - target) < 60000) {
        fireNotification(r);
      }
    });
  }, 30000);

  reminders.forEach(r => {
    if (!r.feito && !r.notificado && r.hora) {
      const target = new Date(r.data + 'T' + r.hora);
      const diff = target - new Date();
      if (diff > 0) setTimeout(() => fireNotification(r), diff);
    }
  });
}

// ═══ TOAST ═════════════════════════════════════════════
function showToast(title, body) {
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastBody').textContent = body;
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

// ═══ UTILS ═════════════════════════════════════════════
function saveReminders() { localStorage.setItem('mari_reminders', JSON.stringify(reminders)); }
function escHtml(t) { return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Load voices for speech synthesis
if (synth) synth.getVoices();
window.speechSynthesis && window.addEventListener('load', () => { setTimeout(() => synth && synth.getVoices(), 500); });

init();
</script>
